services:
  atlas-agent:
    build: .
    image: atlas-agent:latest
    stdin_open: true
    tty: true
    environment:
      ATLAS_BASE_URL: ${ATLAS_BASE_URL}
      ATLAS_AUTH_TOKEN: ${ATLAS_AUTH_TOKEN}
      ATLAS_MODEL: ${ATLAS_MODEL:-claude-sonnet-4-20250514}
    volumes:
      - ${PWD}:/workspace
    working_dir: /workspace
